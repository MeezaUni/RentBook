[project]
name = "rentbook"
version = "1.0.0"
description = "Family property rent & maintenance management (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
